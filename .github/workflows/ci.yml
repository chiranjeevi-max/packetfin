name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcap-dev
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libpcap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcap-dev
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  windows:
    name: Build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked
      - name: Fetch the Npcap SDK
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\npcap-sdk.zip"
          Invoke-WebRequest https://npcap.com/dist/npcap-sdk-1.17.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne 'AB7E1A6CB8D07427E0071EC11BE380BD9D2BB19AE6AB3F5EDE0698C301638258') {
            throw "Npcap SDK checksum mismatch: $hash"
          }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\npcap-sdk"
          "LIBPCAP_LIBDIR=$env:RUNNER_TEMP\npcap-sdk\Lib\x64" >> $env:GITHUB_ENV
      - run: cargo build -p packetfin --locked
      - name: Check the executable's DLL imports
        shell: pwsh
        run: |
          rustup component add llvm-tools
          $sysroot = rustc --print sysroot
          $readobj = Join-Path $sysroot 'lib\rustlib\x86_64-pc-windows-msvc\bin\llvm-readobj.exe'
          $imports = & $readobj --coff-imports target\debug\packetfin.exe |
            Select-String '^\s*Name: (.+)$' | ForEach-Object { $_.Matches[0].Groups[1].Value } |
            Sort-Object -Unique
          $imports
          $allowed = '^(KERNEL32\.dll|ntdll\.dll|bcryptprimitives\.dll|VCRUNTIME140\.dll|wpcap\.dll|api-ms-win-core-[a-z0-9-]+\.dll|api-ms-win-crt-[a-z0-9-]+\.dll)$'
          $unexpected = @($imports | Where-Object { $_ -notmatch $allowed })
          if ($imports.Count -eq 0) { throw 'no imports read from packetfin.exe' }
          if ($unexpected.Count -gt 0) { throw "unexpected DLL imports: $($unexpected -join ', ')" }

  deny:
    name: Dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  fuzz-build:
    name: Fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      # Dependabot updates only the root Cargo.lock, so fuzz/Cargo.lock may be
      # stale here: let Cargo refresh it, as tools/check does, and warn. A
      # lockfile missing from the commit still fails, as --locked did.
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins
      - name: Check fuzz/Cargo.lock
        run: |
          git ls-files --error-unmatch fuzz/Cargo.lock
          git diff --quiet -- fuzz/Cargo.lock ||
            echo "::warning file=fuzz/Cargo.lock::fuzz/Cargo.lock is out of date; run tools/check and commit the refreshed lockfile"

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if [ "$(git log -1 --format=%an "$commit")" = "dependabot[bot]" ]; then
              continue
            fi
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            if ! tools/lint-commit "$RUNNER_TEMP/message"; then
              echo "::error::commit $commit does not follow the rules in CONTRIBUTING.md"
              status=1
            fi
          done
          exit "$status"
