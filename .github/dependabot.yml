version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      fuzz:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
