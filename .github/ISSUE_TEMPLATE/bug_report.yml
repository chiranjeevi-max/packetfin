name: Bug report
description: Packetfin crashed, printed something wrong or rejected valid input.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security issue, follow SECURITY.md instead of filing it here.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `packetfin -v`, or the commit you built.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: The full output or error message.
      render: text
    validations:
      required: true
  - type: textarea
    id: capture
    attributes:
      label: Capture
      description: If you can, attach a small capture that shows the problem. Remove anything private first.
